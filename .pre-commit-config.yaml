# Shared pre-commit setup for every app, kept in sync by a script: change the shared copy, not
# this file, except below the app-specific marker.
exclude: 'node_modules|\.git/|\.history/'
default_stages: [pre-commit]
fail_fast: false
# ruff targets py314, which writes `except A, B:`; the AST hooks must parse it too.
default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "seminary.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg|.*html|.*/public/frontend/.*"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Bundles, vendored code, Jinja templates and the SPAs (which keep their own tooling).
        exclude: &js_exclude |
            (?x)^(
                seminary/public/dist/.*|
                seminary/public/js/lib/.*|
                seminary/public/frontend/.*|
                seminary/public/.*/assets/.*|
                seminary/templates/includes/.*|
                .*node_modules.*|
                .*boilerplate.*|
                cypress/.*|
                docs/.*|
                frontend/.*|
                portal-shell/.*
            )$

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ["--quiet"]
        exclude: *js_exclude

  - repo: https://github.com/pycqa/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        language_version: python3.14
        # Findings already there are in the baseline, tracked in a decision record; new ones fail.
        args: ["-c", "bandit.yaml", "-b", ".bandit-baseline.json"]
        # Tests assert and use fixed passwords on purpose; scripts are dev tools.
        exclude: '^(scripts|tooling|runbooks|prototypes)/|/tests/|/test_[^/]*\.py$'

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        language_version: python3.14
        args: ["--baseline", ".secrets.baseline"]
        exclude: 'README\.md|docs/accessibility/conformance\.json|\.bandit-baseline\.json|seminary/public/frontend/.*|seminary/builder_files/.*|.*\.pot?$'

  - repo: local
    hooks:
      # The same scan CI runs, on the files being committed.
      - id: semgrep-frappe
        name: Semgrep (Frappe rules)
        entry: scripts/semgrep.sh
        # One process: in a fresh checkout (CI) parallel runs would all clone the rules at once.
        require_serial: true
        language: python
        language_version: python3.14
        additional_dependencies: ["semgrep==1.162.0"]
        types_or: [python, javascript, json]
        exclude: 'seminary/public/frontend/|seminary/builder_files/|^(scripts|tooling|runbooks|prototypes|frontend|portal-shell)/'
      - id: stabilize-pot
        name: Stabilize POT file (prevent translation churn)
        entry: python scripts/stabilize-pot.py
        language: python
        always_run: true
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        alias: eslint-accessibility
        name: eslint (accessibility, .vue)
        types: [vue]
        args: ["--no-eslintrc", "-c", ".eslintrc-a11y.json", "--quiet"]
        additional_dependencies:
          - eslint@8.44.0
          - eslint-plugin-vuejs-accessibility@2.4.1
          # The plugin requires it without declaring it.
          - globals@13.24.0
          - vue-eslint-parser@9.4.3
          # Its comment-directive rule is what reads eslint-disable comments in templates.
          - eslint-plugin-vue@9.33.0
          - "@typescript-eslint/parser@6.21.0"
          - typescript@5.4.5
        exclude: 'node_modules|seminary/public/'

  # ---- app-specific hooks below (kept by sync.py) ----
