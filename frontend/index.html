<!doctype html>
<html lang="{{ (boot.lang or 'en') | e }}">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/seminary/images/klisia_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/seminary/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/seminary/images/portal-icon-192.png" />
    <title>{{ (title or "Seminary ERP") | e }}</title>
    {{ portal_theme_head or "" }}
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.csrf_token = '{{ csrf_token }}'
    </script>
    <script>
      {% for key in boot %}
      window["{{ key }}"] = {{ boot[key] | tojson }};
      {% endfor %}
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
